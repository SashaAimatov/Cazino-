<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kasino Aimatov — Aimatov Silver Group</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-body: #0b0c10;
            --bg-card: #14161f;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --accent: #ffffff;
            --border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(255, 255, 255, 0.05);
        }

        [data-theme="light"] {
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --accent: #000000;
            --border: rgba(0, 0, 0, 0.08);
            --input-bg: rgba(0, 0, 0, 0.04);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0; padding: 14px 14px 90px 14px;
            background: var(--bg-body); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            min-height: 100vh; transition: background 0.3s, color 0.3s;
        }

        /* Верхняя панель бренда */
        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px; padding: 0 4px;
        }
        .menu-icon, .icon-btn {
            background: var(--bg-card); border: 1px solid var(--border);
            width: 40px; height: 40px; border-radius: 14px; display: flex;
            align-items: center; justify-content: center; cursor: pointer; color: var(--text-main); font-size: 16px;
        }
        .brand-title { font-size: 16px; font-weight: 700; letter-spacing: 0.3px; }

        /* Карточка баланса */
        .wallet-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 24px; padding: 20px; text-align: center; margin-bottom: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .wallet-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .wallet-sum { font-size: 32px; font-weight: 800; margin: 6px 0 4px; color: var(--text-main); }
        .wallet-sum span { font-size: 18px; font-weight: 700; color: var(--text-muted); margin-left: 4px; }
        .wallet-id { font-size: 11px; color: var(--text-muted); font-family: monospace; letter-spacing: 0.5px; }

        /* Поле ставки */
        .bet-box {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; padding: 12px 16px; margin-bottom: 14px;
            display: flex; align-items: center; justify-content: center;
        }
        .bet-box input {
            width: 100%; background: transparent; border: none; color: var(--text-main);
            font-size: 15px; font-weight: 600; text-align: center; outline: none;
        }
        .bet-box input::placeholder { color: var(--text-muted); }

        /* Основной игровой блок */
        .game-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 24px; padding: 20px; text-align: center; margin-bottom: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .game-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }

        /* Слоты */
        .slots-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; }
        .slot-box {
            width: 76px; height: 88px; background: var(--input-bg); border: 1px solid var(--border);
            border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 36px;
        }
        .slot-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }

        .action-btn {
            width: 100%; padding: 16px; border-radius: 16px; border: none;
            background: var(--accent); color: var(--bg-body); font-size: 16px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2); transition: transform 0.1s;
        }
        .action-btn:active { transform: scale(0.97); }

        /* Фарм / Майнинг */
        .farm-circle {
            width: 140px; height: 140px; margin: 16px auto; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
            border: 2px solid var(--border); display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: 800; letter-spacing: 1px; cursor: pointer; transition: transform 0.08s;
            box-shadow: 0 0 30px rgba(0,0,0,0.3); color: var(--text-main);
        }
        .farm-circle:active { transform: scale(0.94); }
        .farm-info { font-size: 12px; color: var(--text-muted); margin-top: 10px; }

        .status-msg { margin-top: 12px; font-size: 13px; font-weight: 600; min-height: 20px; }

        /* Секции */
        .section { display: none; }
        .section.active { display: block; }

        /* Нижний Dock навигации (только Игры и Фарм) */
        .bottom-dock {
            position: fixed; bottom: 12px; left: 14px; right: 14px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 22px; display: flex; padding: 6px; z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(20px);
        }
        .dock-item {
            flex: 1; padding: 10px 4px; border: none; background: transparent;
            color: var(--text-muted); border-radius: 16px; font-size: 11px; font-weight: 600;
            display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; transition: 0.2s;
        }
        .dock-item.active { color: var(--text-main); background: var(--input-bg); }
    </style>
</head>
<body data-theme="dark">

    <!-- Верхняя панель -->
    <div class="top-bar">
        <div class="menu-icon" onclick="toggleTheme()">🌓</div>
        <div class="brand-title">Aimatov Silver Group</div>
        <div class="icon-btn" onclick="loadUserData()">⚙️</div>
    </div>

    <!-- Баланс -->
    <div class="wallet-card">
        <div class="wallet-title">Счет игрока</div>
        <div class="wallet-sum"><span id="balance">500,000</span><span>ASG</span></div>
        <div class="wallet-id" id="aima-id">AIMA-0000-0000-0000-0000</div>
    </div>

    <div class="bet-box">
        <input type="number" id="bet-input" value="100" placeholder="Ставка ASG">
    </div>

    <!-- 1. ВКЛАДКА ИГРЫ -->
    <div id="sec-games" class="section active">
        <div class="game-card">
            <div class="game-title">Classic Slots</div>
            <div class="slots-row">
                <div class="slot-box" id="r1">💎</div>
                <div class="slot-box" id="r2">7</div>
                <div class="slot-box" id="r3">🔔</div>
            </div>
            <div class="slot-desc">Три семерки = 25x</div>
            <button class="action-btn" onclick="playSlots()">Крутить</button>
            <div class="status-msg" id="msg-slots"></div>
        </div>
    </div>

    <!-- 2. ВКЛАДКА ФАРМ (МАЙНИНГ) -->
    <div id="sec-farm" class="section">
        <div class="game-card">
            <div class="game-title">Чеканка фишек ASG</div>
            <div class="farm-circle" onclick="tapMine()">ASG</div>
            <div class="farm-info" id="farm-info">+15 ASG на баланс (-3 ASG налог казино)</div>
            <div class="status-msg" id="msg-farm"></div>
        </div>
    </div>

    <!-- Нижнее меню (Dock без рейтинга) -->
    <nav class="bottom-dock">
        <button class="dock-item active" onclick="switchTab('games', this)">
            <span>🎲</span><span>Игры</span>
        </button>
        <button class="dock-item" onclick="switchTab('farm', this)">
            <span>⚡</span><span>Фарм</span>
        </button>
    </nav>

    <script>
        const API_URL = "https://kasino-aimatov.onrender.com";
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        const userId = tg?.initDataUnsafe?.user?.id || 5399819309;
        const userName = tg?.initDataUnsafe?.user?.first_name || "Alexander_Aimatov";

        let state = {
            aima_id: localStorage.getItem("asg_id") || "AIMA-5399-8193-8492",
            balance: parseFloat(localStorage.getItem("asg_bal")) || 500000,
            casino_bank: parseFloat(localStorage.getItem("asg_bank")) || 1000000000
        };

        function saveState() {
            localStorage.setItem("asg_id", state.aima_id);
            localStorage.setItem("asg_bal", state.balance);
            renderUI();
        }

        function renderUI() {
            document.getElementById("aima-id").innerText = state.aima_id;
            document.getElementById("balance").innerText = Math.floor(state.balance).toLocaleString("ru-RU");
        }

        function toggleTheme() {
            const body = document.body;
            const current = body.getAttribute("data-theme");
            body.setAttribute("data-theme", current === "dark" ? "light" : "dark");
            tg?.HapticFeedback?.impactOccurred("light");
        }

        function switchTab(tab, btn) {
            document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
            document.querySelectorAll(".dock-item").forEach(b => b.classList.remove("active"));
            document.getElementById(`sec-${tab}`).classList.add("active");
            btn.classList.add("active");
            tg?.HapticFeedback?.impactOccurred("light");
        }

        async function loadUserData() {
            try {
                const res = await fetch(`${API_URL}/api/user`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: userId, username: userName })
                });
                if (res.ok) {
                    const data = await res.json();
                    state.aima_id = data.aima_id;
                    state.balance = data.balance;
                    saveState();
                }
            } catch(e) {}
        }

        // ИГРА: СЛОТЫ
        async function playSlots() {
            const bet = Math.ceil(parseFloat(document.getElementById("bet-input").value));
            const msg = document.getElementById("msg-slots");
            const r1 = document.getElementById("r1");
            const r2 = document.getElementById("r2");
            const r3 = document.getElementById("r3");

            if (isNaN(bet) || bet <= 0 || bet > state.balance) {
                msg.innerHTML = `<span style="color:#ef4444">Недостаточно средств</span>`;
                return;
            }

            state.balance -= bet;
            saveState();
            msg.innerHTML = "Крутим...";
            tg?.HapticFeedback?.impactOccurred("medium");

            setTimeout(() => {
                const symbols = ["💎", "7", "🔔", "🍒", "🌲"];
                const s1 = symbols[Math.floor(Math.random() * symbols.length)];
                const s2 = Math.random() < 0.6 ? s1 : symbols[Math.floor(Math.random() * symbols.length)];
                const s3 = (s1 === s2 && Math.random() < 0.3) ? "7" : symbols[Math.floor(Math.random() * symbols.length)];
                
                r1.innerText = s1; r2.innerText = s2; r3.innerText = s3;

                let mult = 0;
                if (s1 === s2 && s2 === s3) {
                    mult = (s3 === "7") ? 25 : 5;
                }
                
                if (mult > 0) {
                    const win = bet * mult;
                    state.balance += win;
                    saveState();
                    msg.innerHTML = `<span style="color:#10b981">Выигрыш +${win} ASG (x${mult})!</span>`;
                    tg?.HapticFeedback?.notificationOccurred("success");
                } else {
                    msg.innerHTML = `<span style="color:var(--text-muted)">Попробуйте еще раз</span>`;
                    tg?.HapticFeedback?.notificationOccurred("error");
                }
            }, 800);
        }

        // ФАРМ (КЛИКЕР С НАЛОГОМ)
        function tapMine() {
            const tax = 3;
            const net = 15;
            state.balance += net;
            saveState();
            document.getElementById("msg-farm").innerHTML = `<span style="color:#10b981">+${net} ASG на баланс (-${tax} ASG налог казино)</span>`;
            tg?.HapticFeedback?.impactOccurred("light");
        }

        renderUI();
        loadUserData();
    </script>
</body>
</html>
