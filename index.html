<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aimatov Silver Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f1015;
            --card: rgba(28, 30, 38, 0.85);
            --accent: #d4af37;
            --text: #f5f5f7;
            --muted: #8e8e93;
            --green: #32d74b;
            --red: #ff453a;
        }

        body {
            margin: 0;
            padding: 14px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .header-card { text-align: center; }
        .brand { font-size: 13px; letter-spacing: 1.5px; color: var(--accent); font-weight: 700; }
        .aima-id { font-size: 12px; color: var(--muted); margin: 4px 0 10px; font-family: monospace; }
        .balance-wrap { font-size: 32px; font-weight: 800; }
        .balance-wrap small { font-size: 16px; color: var(--accent); }

        .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
        .tab {
            flex: 1; padding: 11px 6px; border-radius: 14px; border: none;
            background: rgba(255,255,255,0.06); color: var(--muted);
            font-weight: 600; font-size: 13px; transition: 0.2s; cursor: pointer;
        }
        .tab.active { background: var(--accent); color: #000; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        h2 { margin: 0 0 12px 0; font-size: 20px; font-weight: 700; }

        .reels { display: flex; justify-content: center; gap: 12px; margin: 18px 0; }
        .reel {
            width: 72px; height: 82px; border-radius: 16px;
            background: rgba(0,0,0,0.45); border: 1px solid rgba(212,175,55,0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 38px; transition: transform 0.15s;
        }
        .spinning { animation: shake 0.18s infinite; }
        @keyframes shake {
            0% { transform: translateY(-3px); }
            50% { transform: translateY(3px); }
            100% { transform: translateY(-3px); }
        }

        .crash-screen, .dice-box {
            height: 90px; border-radius: 16px; background: rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            font-size: 36px; font-weight: 800; margin: 14px 0; color: var(--accent);
        }

        input {
            width: 100%; padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.35); color: #fff; font-size: 16px;
            margin-bottom: 10px; box-sizing: border-box; outline: none;
        }

        .primary-btn, .secondary-btn, .tap-btn {
            width: 100%; padding: 15px; border-radius: 14px; border: none;
            font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.1s;
            margin-bottom: 8px;
        }
        .primary-btn { background: var(--accent); color: #000; }
        .secondary-btn { background: rgba(255,255,255,0.1); color: #fff; }
        .tap-btn { background: linear-gradient(135deg, #d4af37, #aa7c11); color: #000; font-size: 18px; padding: 20px; }
        button:active { transform: scale(0.96); }

        .btn-row { display: flex; gap: 10px; }
        .status-msg { text-align: center; margin-top: 10px; font-weight: 600; min-height: 22px; font-size: 14px; }
        .divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 16px 0; }
    </style>
</head>
<body>
    <div class="app">
        <header class="card header-card">
            <div class="brand">🏛 AIMATOV SILVER GROUP</div>
            <div class="aima-id" id="aima-id">AIMA-XXXX-XXXX</div>
            <div class="balance-wrap">
                <span id="balance">0</span> <small>ASG</small>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab active" onclick="switchTab('slots', this)">🎰 Слоты</button>
            <button class="tab" onclick="switchTab('crash', this)">🚀 Краш</button>
            <button class="tab" onclick="switchTab('dice', this)">🎲 Кости</button>
            <button class="tab" onclick="switchTab('mining', this)">⛏ Майнинг</button>
        </nav>

        <!-- СЛОТЫ -->
        <section id="tab-slots" class="card tab-content active">
            <h2>Слоты Aimatov</h2>
            <div class="reels" id="reels">
                <div class="reel">7️⃣</div>
                <div class="reel">7️⃣</div>
                <div class="reel">7️⃣</div>
            </div>
            <input type="number" id="bet-slots" value="100" placeholder="Ставка ASG">
            <button class="primary-btn" id="btn-slots" onclick="playSlots()">Крутить барабан</button>
            <div class="status-msg" id="msg-slots"></div>
        </section>

        <!-- КРАШ -->
        <section id="tab-crash" class="card tab-content">
            <h2>Краш-Индекс</h2>
            <div class="crash-screen" id="crash-screen">1.00x</div>
            <input type="number" id="bet-crash" value="100" placeholder="Ставка ASG">
            <input type="number" id="target-crash" value="2.0" step="0.1" placeholder="Авто-вывод (например 2.0)">
            <button class="primary-btn" id="btn-crash" onclick="playCrash()">Запустить сделку</button>
            <div class="status-msg" id="msg-crash"></div>
        </section>

        <!-- КОСТИ -->
        <section id="tab-dice" class="card tab-content">
            <h2>Кости (Больше / Меньше)</h2>
            <div class="dice-box" id="dice-box">🎲</div>
            <input type="number" id="bet-dice" value="100" placeholder="Ставка ASG">
            <div class="btn-row">
                <button class="primary-btn" onclick="playDice('low')">Меньше (1-3)</button>
                <button class="primary-btn" onclick="playDice('high')">Больше (4-6)</button>
            </div>
            <div class="status-msg" id="msg-dice"></div>
        </section>

        <!-- МАЙНИНГ И КОЛЛЕКТОРЫ -->
        <section id="tab-mining" class="card tab-content">
            <h2>Майнинг & Коллекторы</h2>
            <div class="mine-box">
                <p>Накоплено кликами: <b id="click-buffer">0</b> ASG <small>(Налог 10-30%)</small></p>
                <button class="tap-btn" onclick="tapMine()">⚡ КЛИК (+5 ASG)</button>
                <button class="secondary-btn" onclick="claimClicks()">Вывести на баланс (с налогом)</button>
            </div>
            <hr class="divider">
            <div class="collector-box">
                <p>Уровень коллектора: <b id="col-lvl">1</b></p>
                <p>В хранилище: <b id="col-pending">0</b> ASG</p>
                <div class="btn-row">
                    <button class="primary-btn" onclick="claimCollector()">Собрать</button>
                    <button class="secondary-btn" onclick="upgradeCollector()">Улучшить</button>
                </div>
            </div>
            <div class="status-msg" id="msg-mining"></div>
        </section>
    </div>

    <script>
        const API_URL = "https://kasino-aimatov.onrender.com";
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe?.user?.id || 5399819309;
        const username = tg.initDataUnsafe?.user?.first_name || "Player";

        let clickCount = 0;

        async function loadUser() {
            try {
                const res = await fetch(`${API_URL}/api/user`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ user_id: userId, username: username })
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById("aima-id").innerText = data.aima_id;
                    document.getElementById("balance").innerText = data.balance.toLocaleString();
                    document.getElementById("col-lvl").innerText = data.collector_level;
                    document.getElementById("col-pending").innerText = data.pending_collector;
                }
            } catch (e) {
                console.error(e);
            }
        }

        function switchTab(tab, btnElement) {
            document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
            document.querySelectorAll(".tab").forEach(el => el.classList.remove("active"));
            document.getElementById(`tab-${tab}`).classList.add("active");
            if (btnElement) btnElement.classList.add("active");
            tg.HapticFeedback?.impactOccurred("light");
        }

        async function playSlots() {
            const bet = parseFloat(document.getElementById("bet-slots").value);
            const msg = document.getElementById("msg-slots");
            const reels = document.querySelectorAll(".reel");
            
            reels.forEach(r => r.classList.add("spinning"));
            msg.innerText = "Вращаем барабаны...";
            tg.HapticFeedback?.impactOccurred("medium");

            try {
                const res = await fetch(`${API_URL}/api/play`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ user_id: userId, bet: bet, game: "slots" })
                });
                const data = await res.json();

                setTimeout(() => {
                    reels.forEach((r, idx) => {
                        r.classList.remove("spinning");
                        if (data.details?.reels) r.innerText = data.details.reels[idx];
                    });
                    if (!res.ok) {
                        msg.innerHTML = `<span style="color:var(--red)">${data.detail}</span>`;
                        return;
                    }
                    document.getElementById("balance").innerText = data.balance.toLocaleString();
                    if (data.win > 0) {
                        msg.innerHTML = `<span style="color:var(--green)">🔥 Выигрыш: +${data.win} ASG (x${data.multiplier})</span>`;
                        tg.HapticFeedback?.notificationOccurred("success");
                    } else {
                        msg.innerHTML = `<span style="color:var(--muted)">Почти выпало! Попробуй еще раз</span>`;
                        tg.HapticFeedback?.notificationOccurred("error");
                    }
                }, 1100);
            } catch (e) {
                reels.forEach(r => r.classList.remove("spinning"));
                msg.innerHTML = `<span style="color:var(--red)">Ошибка связи с сервером</span>`;
            }
        }

        async function playCrash() {
            const bet = parseFloat(document.getElementById("bet-crash").value);
            const target = document.getElementById("target-crash").value;
            const screen = document.getElementById("crash-screen");
            const msg = document.getElementById("msg-crash");

            screen.innerText = "🚀 Взлет...";
            msg.innerText = "";

            try {
                const res = await fetch(`${API_URL}/api/play`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ user_id: userId, bet: bet, game: "crash", choice: target })
                });
                const data = await res.json();

                setTimeout(() => {
                    if (!res.ok) {
                        msg.innerHTML = `<span style="color:var(--red)">${data.detail}</span>`;
                        return;
                    }
                    screen.innerText = `${data.details.crash_point}x`;
                    document.getElementById("balance").innerText = data.balance.toLocaleString();
                    if (data.win > 0) {
                        msg.innerHTML = `<span style="color:var(--green)">Успешный вывод: +${data.win} ASG!</span>`;
                        tg.HapticFeedback?.notificationOccurred("success");
                    } else {
                        msg.innerHTML = `<span style="color:var(--red)">💥 Краш на ${data.details.crash_point}x</span>`;
                        tg.HapticFeedback?.notificationOccurred("error");
                    }
                }, 1300);
            } catch (e) {
                msg.innerHTML = `<span style="color:var(--red)">Ошибка связи с сервером</span>`;
            }
        }

        async function playDice(choice) {
            const bet = parseFloat(document.getElementById("bet-dice").value);
            const box = document.getElementById("dice-box");
            const msg = document.getElementById("msg-dice");

            box.innerText = "🔄";
            try {
                const res = await fetch(`${API_URL}/api/play`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ user_id: userId, bet: bet, game: "dice", choice: choice })
                });
                const data = await res.json();

                setTimeout(() => {
                    if (!res.ok) {
                        msg.innerHTML = `<span style="color:var(--red)">${data.detail}</span>`;
                        return;
                    }
                    box.innerText = `🎲 ${data.details.dice}`;
                    document.getElementById("balance").innerText = data.balance.toLocaleString();
                    if (data.win > 0) {
                        msg.innerHTML = `<span style="color:var(--green)">Победа: +${data.win} ASG!</span>`;
                        tg.HapticFeedback?.notificationOccurred("success");
                    } else {
                        msg.innerHTML = `<span style="color:var(--red)">Выпало ${data.details.dice}. Проигрыш</span>`;
                    }
                }, 800);
            } catch (e) {
                msg.innerHTML = `<span style="color:var(--red)">Ошибка связи с сервером</span>`;
            }
        }

        function tapMine() {
            if (clickCount >= 50) return;
            clickCount++;
            document.getElementById("click-buffer").innerText = clickCount * 5;
            tg.HapticFeedback?.impactOccurred("light");
        }

        async function claimClicks() {
            if (clickCount <= 0) return;
            const msg = document.getElementById("msg-mining");
            try {
                const res = await fetch(`${API_URL}/api/mine_click`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ user_id: userId, clicks: clickCount })
                });
                const data = await res.json();
                if (res.ok) {
                    clickCount = 0;
                    document.getElementById("click-buffer").innerText = "0";
                    document.getElementById("balance").innerText = data.balance.toLocaleString();
                    msg.innerHTML = `<span style="color:var(--green)">Зачислено +${data.net} ASG (Налог казино ${data.tax_percent}%: -${data.tax} ASG)</span>`;
                }
            } catch (e) {
                msg.innerHTML = `<span style="color:var(--red)">Ошибка вывода</span>`;
            }
        }

        async function claimCollector() {
            const msg = document.getElementById("msg-mining");
            try {
                const res = await fetch(`${API_URL}/api/collector_claim`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ user_id: userId })
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById("balance").innerText = data.balance.toLocaleString();
                    document.getElementById("col-pending").innerText = "0";
                    msg.innerHTML = `<span style="color:var(--green)">Собрано +${data.net} ASG (Налог ${data.tax_percent}%)</span>`;
                } else {
                    msg.innerHTML = `<span style="color:var(--red)">${data.detail}</span>`;
                }
            } catch (e) {
                msg.innerHTML = `<span style="color:var(--red)">Ошибка сбора</span>`;
            }
        }

        async function upgradeCollector() {
            const msg = document.getElementById("msg-mining");
            try {
                const res = await fetch(`${API_URL}/api/collector_upgrade`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ user_id: userId })
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById("balance").innerText = data.balance.toLocaleString();
                    document.getElementById("col-lvl").innerText = data.level;
                    msg.innerHTML = `<span style="color:var(--green)">Коллектор улучшен до ур. ${data.level}!</span>`;
                } else {
                    msg.innerHTML = `<span style="color:var(--red)">${data.detail}</span>`;
                }
            } catch (e) {
                msg.innerHTML = `<span style="color:var(--red)">Ошибка улучшения</span>`;
            }
        }

        loadUser();
    </script>
</body>
</html>
