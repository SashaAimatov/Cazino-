<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kasino Aimatov</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d0f17;
            --card-bg: rgba(26, 31, 46, 0.85);
            --accent-gold: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.3);
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --radius-main: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 75px;
            overflow-x: hidden;
        }

        header {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-block {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .user-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }

        .user-aid {
            font-size: 11px;
            font-family: monospace;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .balance-badge {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(245, 158, 11, 0.05));
            border: 1px solid var(--accent-gold);
            padding: 6px 12px;
            border-radius: 20px;
            text-align: right;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .balance-label {
            font-size: 10px;
            color: var(--accent-gold);
            text-transform: uppercase;
            font-weight: 700;
        }

        .balance-val {
            font-size: 15px;
            font-weight: 800;
            color: #fff;
        }

        main {
            padding: 16px;
            flex-grow: 1;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.25s ease-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panel-card {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-main);
            padding: 18px;
            margin-bottom: 16px;
            backdrop-filter: blur(8px);
        }

        .panel-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .input-field {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            color: #fff;
            padding: 12px 14px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--accent-gold);
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .btn-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .slots-display {
            background: #090b10;
            border: 2px solid var(--accent-gold);
            border-radius: 14px;
            display: flex;
            justify-content: space-around;
            padding: 24px 10px;
            font-size: 44px;
            margin-bottom: 16px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .slot-box {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }

        .grid-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 16px 0;
        }

        .grid-cell {
            aspect-ratio: 1;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .grid-cell.active-step {
            border-color: var(--accent-gold);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .grid-cell.revealed-gem {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--accent-green);
        }

        .grid-cell.revealed-bomb {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--accent-red);
        }

        .tower-board {
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            margin: 16px 0;
        }

        .tower-floor {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 4px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.4);
        }

        .tower-floor.current-floor {
            border: 1px solid var(--accent-gold);
            background: rgba(245, 158, 11, 0.05);
        }

        .coin-btn {
            width: 170px;
            height: 170px;
            margin: 20px auto;
            border-radius: 50%;
            background: radial-gradient(circle, #fbbf24 0%, #d97706 70%, #92400e 100%);
            border: 4px solid #fef3c7;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.5), inset 0 0 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            cursor: pointer;
            transition: transform 0.05s ease-out;
        }

        .coin-btn:active {
            transform: scale(0.92);
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            gap: 4px;
            cursor: pointer;
            width: 20%;
        }

        .nav-btn span.icon {
            font-size: 18px;
        }

        .nav-btn.active {
            color: var(--accent-gold);
        }

        .toast {
            position: fixed;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--border-subtle);
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            z-index: 200;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <header>
        <div class="user-block">
            <div id="u-name" class="user-name">Загрузка...</div>
            <div id="u-aid" class="user-aid">ID: AIMA-....</div>
        </div>
        <div class="balance-badge">
            <div class="balance-label">Баланс ASG</div>
            <div id="u-balance" class="balance-val">0</div>
        </div>
    </header>

    <div id="toast" class="toast"></div>

    <main>
        <!-- СЛОТЫ -->
        <div id="tab-slots" class="tab-content active">
            <div class="panel-card">
                <div class="panel-title">🎰 Слоты Удачи</div>
                <div class="slots-display">
                    <div id="s-1" class="slot-box">💎</div>
                    <div id="s-2" class="slot-box">7️⃣</div>
                    <div id="s-3" class="slot-box">🍒</div>
                </div>
                <div class="input-group">
                    <label>Ставка (ASG)</label>
                    <input type="number" id="slots-bet" class="input-field" value="1000" min="10">
                </div>
                <button id="btn-spin" class="btn-action" onclick="playSlots()">КРУТИТЬ</button>
            </div>
        </div>

        <!-- МИНЫ -->
        <div id="tab-mines" class="tab-content">
            <div class="panel-card">
                <div class="panel-title">💣 Сапер (Mines)</div>
                <div class="input-group">
                    <label>Количество бомб (1 - 24)</label>
                    <input type="number" id="mines-count" class="input-field" value="3" min="1" max="24">
                </div>
                <div class="input-group">
                    <label>Ставка (ASG)</label>
                    <input type="number" id="mines-bet" class="input-field" value="1000" min="10">
                </div>
                <div id="mines-grid" class="grid-board"></div>
                <button id="btn-mines-start" class="btn-action" onclick="startMines()">НАЧАТЬ ИГРУ</button>
                <button id="btn-mines-cashout" class="btn-action" style="display:none; margin-top:8px; background:linear-gradient(135deg, #10b981, #059669);" onclick="cashoutMines()">ЗАБРАТЬ</button>
            </div>
        </div>

        <!-- БАШНЯ -->
        <div id="tab-tower" class="tab-content">
            <div class="panel-card">
                <div class="panel-title">🏰 Башня (Tower)</div>
                <div class="input-group">
                    <label>Ставка (ASG)</label>
                    <input type="number" id="tower-bet" class="input-field" value="1000" min="10">
                </div>
                <div id="tower-board" class="tower-board"></div>
                <button id="btn-tower-start" class="btn-action" onclick="startTower()">ПОДНЯТЬСЯ НА БАШНЮ</button>
                <button id="btn-tower-cashout" class="btn-action" style="display:none; margin-top:8px; background:linear-gradient(135deg, #10b981, #059669);" onclick="cashoutTower()">ЗАБРАТЬ ВЫИГРЫШ</button>
            </div>
        </div>

        <!-- КЛИКЕР -->
        <div id="tab-clicker" class="tab-content">
            <div class="panel-card" style="text-align: center;">
                <div class="panel-title" style="justify-content: center;">🪙 Монетный Кликер</div>
                <p style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">Тапай по монете (+100 ASG за клик)</p>
                <div class="coin-btn" onclick="handleClick(event)">👑</div>
                <div id="click-status" style="font-size:12px; color:var(--text-muted);">Готов к тапам</div>
            </div>
        </div>

        <!-- ПЕРЕВОД -->
        <div id="tab-transfer" class="tab-content">
            <div class="panel-card">
                <div class="panel-title">💸 Перевод игроку</div>
                <div class="input-group">
                    <label>Получатель (AIMA-ID, @username или Telegram ID)</label>
                    <input type="text" id="transfer-target" class="input-field" placeholder="AIMA-XXXX-XXXX-XXXX-XXXX">
                </div>
                <div class="input-group">
                    <label>Сумма перевода (ASG)</label>
                    <input type="number" id="transfer-amount" class="input-field" placeholder="Минимум 100">
                </div>
                <button class="btn-action" onclick="makeTransfer()">ОТПРАВИТЬ СРЕДСТВА</button>
            </div>
        </div>
    </main>

    <nav>
        <button class="nav-btn active" onclick="switchTab('slots', this)"><span class="icon">🎰</span>Слоты</button>
        <button class="nav-btn" onclick="switchTab('mines', this)"><span class="icon">💣</span>Мины</button>
        <button class="nav-btn" onclick="switchTab('tower', this)"><span class="icon">🏰</span>Башня</button>
        <button class="nav-btn" onclick="switchTab('clicker', this)"><span class="icon">🪙</span>Кликер</button>
        <button class="nav-btn" onclick="switchTab('transfer', this)"><span class="icon">💸</span>Перевод</button>
    </nav>

    <script>
        // Твой актуальный туннель Termux
        const API_BASE = "https://243e2e2ac7eddd.lhr.life";

        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.enableClosingConfirmation();
        }

        let userState = {
            id: tg?.initDataUnsafe?.user?.id || 12345678,
            username: tg?.initDataUnsafe?.user?.username || "Guest_Player",
            balance: 0,
            aima_id: ""
        };

        let activeGame = null; // 'mines' | 'tower'
        let clickTimestamps = [];

        function showToast(msg, isError = false) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.style.borderColor = isError ? "var(--accent-red)" : "var(--accent-gold)";
            toast.style.display = "block";
            setTimeout(() => { toast.style.display = "none"; }, 2500);
        }

        async function syncProfile() {
            try {
                const res = await fetch(`${API_BASE}/api/player?user_id=${userState.id}&username=${encodeURIComponent(userState.username)}`);
                const data = await res.json();
                if (data.status === "ok") {
                    userState.balance = data.data.balance;
                    userState.aima_id = data.data.aima_id;
                    document.getElementById("u-name").innerText = `@${data.data.username}`;
                    document.getElementById("u-aid").innerText = `ID: ${data.data.aima_id}`;
                    document.getElementById("u-balance").innerText = Math.floor(data.data.balance).toLocaleString();
                } else if (data.status === "banned") {
                    document.body.innerHTML = `<div style="text-align:center; padding:50px; color:#ef4444;"><h2>Вы заблокированы</h2><p>${data.message}</p></div>`;
                }
            } catch (err) {
                console.error("Ошибка синхронизации:", err);
            }
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
            document.querySelectorAll(".nav-btn").forEach(el => el.classList.remove("active"));
            document.getElementById(`tab-${tabName}`).classList.add("active");
            btn.classList.add("active");
        }

        // --- ИГРА: СЛОТЫ ---
        async function playSlots() {
            const bet = parseFloat(document.getElementById("slots-bet").value);
            if (isNaN(bet) || bet <= 0) return showToast("Укажите корректную ставку", true);

            const btn = document.getElementById("btn-spin");
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/api/game/spin`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ user_id: userState.id, bet: bet })
                });
                const data = await res.json();
                if (data.status === "ok") {
                    document.getElementById("s-1").innerText = data.combination[0];
                    document.getElementById("s-2").innerText = data.combination[1];
                    document.getElementById("s-3").innerText = data.combination[2];
                    userState.balance = data.balance;
                    document.getElementById("u-balance").innerText = Math.floor(data.balance).toLocaleString();

                    if (data.win > 0) {
                        showToast(`Победа! Выигрыш: +${Math.floor(data.win).toLocaleString()} ASG`);
                    } else {
                        showToast("Не повезло. Попробуйте снова!", true);
                    }
                } else {
                    showToast(data.message || "Ошибка ставки", true);
                }
            } catch(e) {
                showToast("Сервер недоступен", true);
            } finally {
                btn.disabled = false;
            }
        }

        // --- ИГРА: МИНЫ ---
        function renderMinesBoard() {
            const grid = document.getElementById("mines-grid");
            grid.innerHTML = "";
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement("div");
                cell.className = "grid-cell";
                cell.id = `m-cell-${i}`;
                cell.innerText = "❓";
                cell.onclick = () => stepMine(i);
                grid.appendChild(cell);
            }
        }

        async function startMines() {
            const bet = parseFloat(document.getElementById("mines-bet").value);
            const bombs = parseInt(document.getElementById("mines-count").value);

            try {
                const res = await fetch(`${API_BASE}/api/mines/start`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ user_id: userState.id, bet, bombs })
                });
                const data = await res.json();
                if (data.status === "ok") {
                    renderMinesBoard();
                    document.getElementById("btn-mines-start").style.display = "none";
                    document.getElementById("btn-mines-cashout").style.display = "block";
                    document.getElementById("btn-mines-cashout").innerText = `ЗАБРАТЬ (${Math.floor(bet)} ASG)`;
                    userState.balance = data.balance;
                    document.getElementById("u-balance").innerText = Math.floor(data.balance).toLocaleString();
                } else {
                    showToast(data.message, true);
                }
            } catch (e) {
                showToast("Ошибка сети", true);
            }
        }

        async function stepMine(idx) {
            const cell = document.getElementById(`m-cell-${idx}`);
            if (cell.classList.contains("revealed-gem")) return;

            try {
                const res = await fetch(`${API_BASE}/api/mines/step`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ user_id: userState.id, tile_index: idx })
                });
                const data = await res.json();
                if (data.status === "ok") {
                    cell.innerText = "💎";
                    cell.classList.add("revealed-gem");
                    document.getElementById("btn-mines-cashout").innerText = `ЗАБРАТЬ (${Math.floor(data.next_win)} ASG, x${data.multiplier.toFixed(2)})`;
                } else if (data.status === "exploded") {
                    cell.innerText = "💥";
                    cell.classList.add("revealed-bomb");
                    showToast("БОМБА! Ставка сгорела", true);
                    resetMinesControls();
                }
            } catch(e) {
                showToast("Ошибка хода", true);
            }
        }

        async function cashoutMines() {
            try {
                const res = await fetch(`${API_BASE}/api/mines/cashout`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ user_id: userState.id })
                });
                const data = await res.json();
                if (data.status === "ok") {
                    showToast(`Вы забрали: +${Math.floor(data.win)} ASG!`);
                    userState.balance = data.balance;
                    document.getElementById("u-balance").innerText = Math.floor(data.balance).toLocaleString();
                }
            } finally {
                resetMinesControls();
            }
        }

        function resetMinesControls() {
            document.getElementById("btn-mines-start").style.display = "block";
            document.getElementById("btn-mines-cashout").style.display = "none";
        }

        // --- ИГРА: БАШНЯ ---
        function renderTowerBoard() {
            const board = document.getElementById("tower-board");
            board.innerHTML = "";
            for (let floor = 0; floor < 8; floor++) {
                const row = document.createElement("div");
                row.className = `tower-floor ${floor === 0 ? "current-floor" : ""}`;
                row.id = `t-floor-${floor}`;
                for (let col = 0; col < 4; col++) {
                    const cell = document.createElement("div");
                    cell.className = "grid-cell";
                    cell.innerText = "🪜";
                    cell.onclick = () => stepTower(floor, col);
                    row.appendChild(cell);
                }
                board.appendChild(row);
            }
        }

        async function startTower() {
            const bet = parseFloat(document.getElementById("tower-bet").value);
            try {
                const res = await fetch(`${API_BASE}/api/tower/start`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ user_id: userState.id, bet })
                });
                const data = await res.json();
                if (data.status === "ok") {
                    renderTowerBoard();
                    document.getElementById("btn-tower-start").style.display = "none";
                    document.getElementById("btn-tower-cashout").style.display = "block";
                    document.getElementById("btn-tower-cashout").innerText = `ЗАБРАТЬ (${Math.floor(bet)} ASG)`;
                    userState.balance = data.balance;
                    document.getElementById("u-balance").innerText = Math.floor(data.balance).toLocaleString();
                } else {
                    showToast(data.message, true);
                }
            } catch(e) {
                showToast("Ошибка сети", true);
            }
        }

        async function stepTower(floor, col) {
            try {
                const res = await fetch(`${API_BASE}/api/tower/step`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ user_id: userState.id, choice: col })
                });
                const data = await res.json();
                if (data.status === "ok") {
                    const row = document.getElementById(`t-floor-${floor}`);
                    row.children[col].innerText = "✅";
                    row.classList.remove("current-floor");
                    const nextRow = document.getElementById(`t-floor-${floor + 1}`);
                    if (nextRow) nextRow.classList.add("current-floor");
                    document.getElementById("btn-tower-cashout").innerText = `ЗАБРАТЬ (${Math.floor(data.next_win)} ASG, x${data.multiplier.toFixed(2)})`;
                } else if (data.status === "fell") {
                    document.getElementById(`t-floor-${floor}`).children[col].innerText = "❌";
                    showToast("Падение с башни!", true);
                    resetTowerControls();
                }
            } catch(e) {
                showToast("Ошибка хода", true);
            }
        }

        async function cashoutTower() {
            try {
                const res = await fetch(`${API_BASE}/api/tower/cashout`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ user_id: userState.id })
                });
                const data = await res.json();
                if (data.status === "ok") {
                    showToast(`Вы забрали: +${Math.floor(data.win)} ASG!`);
                    userState.balance = data.balance;
                    document.getElementById("u-balance").innerText = Math.floor(data.balance).toLocaleString();
                }
            } finally {
                resetTowerControls();
            }
        }

        function resetTowerControls() {
            document.getElementById("btn-tower-start").style.display = "block";
            document.getElementById("btn-tower-cashout").style.display = "none";
        }

        // --- КЛИКЕР С ПРОВЕРКОЙ ---
        async function handleClick(e) {
            clickTimestamps.push(Date.now());
            if (clickTimestamps.length >= 10) {
                const intervals = [];
                for (let i = 1; i < clickTimestamps.length; i++) {
                    intervals.push((clickTimestamps[i] - clickTimestamps[i-1]) / 1000);
                }
                clickTimestamps = [];

                try {
                    const res = await fetch(`${API_BASE}/api/clicker/click`, {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({ user_id: userState.id, intervals })
                    });
                    const data = await res.json();
                    if (data.status === "ok") {
                        userState.balance = data.balance;
                        document.getElementById("u-balance").innerText = Math.floor(data.balance).toLocaleString();
                    } else if (data.status === "banned") {
                        showToast(data.message, true);
                        setTimeout(() => location.reload(), 1500);
                    }
                } catch(err) {
                    console.error("Ошибка клика", err);
                }
            }
        }

        // --- ПЕРЕВОД ---
        async function makeTransfer() {
            const target = document.getElementById("transfer-target").value.trim();
            const amount = parseFloat(document.getElementById("transfer-amount").value);

            if (!target || isNaN(amount) || amount <= 0) {
                return showToast("Заполните поля корректно", true);
            }

            try {
                const res = await fetch(`${API_BASE}/api/transfer`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ from_user_id: userState.id, target, amount })
                });
                const data = await res.json();
                if (data.status === "ok") {
                    showToast("Перевод успешно выполнен!");
                    userState.balance = data.balance;
                    document.getElementById("u-balance").innerText = Math.floor(data.balance).toLocaleString();
                    document.getElementById("transfer-target").value = "";
                    document.getElementById("transfer-amount").value = "";
                } else {
                    showToast(data.message || "Ошибка перевода", true);
                }
            } catch(e) {
                showToast("Сервер не отвечает", true);
            }
        }

        // Инициализация при открытии
        renderMinesBoard();
        renderTowerBoard();
        syncProfile();
    </script>
</body>
</html>
